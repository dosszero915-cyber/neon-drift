<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON DRIFT — Arcade Survival</title>
<style>
  :root{color-scheme:dark;--bg:#070914;--panel:rgba(10,15,34,.82);--cyan:#55f6ff;--pink:#ff4dc4;--lime:#c4ff54;--muted:#9ba8c9}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f7ff;touch-action:none}
  button{font:inherit;color:inherit}
  #game{position:relative;width:100%;height:100%;min-height:360px;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#171537 0,#0a0e20 48%,#070914 100%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .scanlines{pointer-events:none;position:absolute;inset:0;z-index:2;opacity:.13;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(137,207,255,.15) 4px,transparent 5px)}
  .vignette{pointer-events:none;position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse,transparent 45%,rgba(3,5,15,.5) 100%)}
  .hud{position:absolute;z-index:3;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left));pointer-events:none;gap:12px}
  .brand{font-size:11px;letter-spacing:.25em;font-weight:900;color:var(--cyan);text-shadow:0 0 14px #55f6ff77;margin-bottom:5px}
  .hud-values{display:flex;gap:clamp(12px,3vw,32px);align-items:center}
  .stat{min-width:54px}.label{font-size:9px;letter-spacing:.17em;color:#9ba8c9;text-transform:uppercase}.value{font-size:clamp(17px,3vw,23px);font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;text-shadow:0 0 12px #55f6ff44}.value.score{color:var(--cyan)}.value.time{color:#fff}.value.lives{color:var(--pink);letter-spacing:.08em}
  .hud-actions{display:flex;gap:8px;pointer-events:auto}
  .icon-btn{width:36px;height:36px;border:1px solid #374162;border-radius:11px;background:#10162acc;color:#dce9ff;display:grid;place-items:center;cursor:pointer;transition:.16s}
  .icon-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px #55f6ff22}
  .screen{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,rgba(5,7,18,.12),rgba(5,7,18,.6));transition:opacity .22s,visibility .22s}
  .screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .card{width:min(460px,92vw);padding:clamp(24px,5vw,42px);border:1px solid #34405d;border-radius:24px;background:linear-gradient(145deg,rgba(16,23,48,.93),rgba(9,13,29,.94));box-shadow:0 28px 90px #0009,0 0 50px #27e8ff13,inset 0 1px #ffffff10;text-align:center;position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;top:0;left:16%;right:16%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);box-shadow:0 0 15px var(--cyan)}
  .eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
  h1{font-size:clamp(38px,10vw,66px);line-height:.94;letter-spacing:-.075em;margin:13px 0 12px;font-weight:950;font-style:italic;text-shadow:0 0 24px #55f6ff42}
  h1 span{color:var(--pink);text-shadow:0 0 22px #ff4dc455}
  .subtitle{color:#b7c2dc;font-size:14px;line-height:1.65;margin:0 auto 22px;max-width:340px}
  .instructions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;color:#c6cee2;font-size:11px;margin:0 auto 24px}
  .key{border:1px solid #394464;border-radius:8px;padding:6px 9px;background:#111831;box-shadow:inset 0 -2px #050916;font-weight:700;color:#ecf5ff}
  .primary{width:100%;border:0;border-radius:12px;padding:15px 18px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#061018;background:linear-gradient(100deg,var(--cyan),#9fffea);box-shadow:0 8px 28px #55f6ff35;cursor:pointer;transition:transform .15s,filter .15s}
  .primary:hover{filter:brightness(1.08);transform:translateY(-2px)}.primary:active{transform:translateY(1px)}
  .best-line{font-size:11px;color:#92a1c4;margin-top:16px}.best-line strong{color:var(--lime)}
  .gameover-title{font-size:clamp(31px,8vw,48px);letter-spacing:-.04em;margin:10px 0;color:#fff}
  .final-score{font-size:clamp(45px,12vw,72px);line-height:1;font-weight:950;color:var(--cyan);text-shadow:0 0 24px #55f6ff66;margin:14px 0 4px;font-variant-numeric:tabular-nums}
  .final-caption{font-size:10px;letter-spacing:.2em;color:#9ba8c9;text-transform:uppercase}
  .new-record{height:20px;margin:11px 0 16px;color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.12em}
  .touch-controls{position:absolute;z-index:4;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 22px;pointer-events:none}
  .touch-btn{pointer-events:auto;width:68px;height:68px;border:1px solid #75efff66;border-radius:50%;background:#0d1939a8;color:#b9faff;font-size:28px;display:grid;place-items:center;box-shadow:0 0 24px #55f6ff1c,inset 0 0 15px #55f6ff12;user-select:none;-webkit-user-select:none;touch-action:none}
  .touch-btn:active,.touch-btn.pressed{background:#55f6ff33;border-color:var(--cyan);transform:scale(.96)}
  .toast{position:absolute;z-index:8;top:74px;left:50%;transform:translate(-50%,-8px);padding:8px 13px;border:1px solid #46516f;border-radius:9px;background:#0c1326dd;color:#dce9ff;font-size:11px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:700px){.touch-controls{display:flex}.hud{padding-top:max(12px,env(safe-area-inset-top))}.hud-values{gap:13px}.stat{min-width:auto}.label{font-size:8px}.value{font-size:17px}.brand{font-size:9px}.icon-btn{width:32px;height:32px}}
  @media(max-height:520px){.card{padding:18px 28px}.subtitle{margin-bottom:13px}.instructions{margin-bottom:14px}.touch-btn{width:54px;height:54px}.touch-controls{bottom:10px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  .value.coin{color:#ffd166}
  .secondary{width:100%;margin-top:10px;border:1px solid #394464;border-radius:12px;padding:12px;background:#111831;color:#dce9ff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.secondary:hover{border-color:var(--cyan)}
  .card.shop{max-height:94vh;overflow-y:auto;touch-action:pan-y;padding:clamp(16px,4vw,28px)}.wallet{color:#ffd166;font-weight:800;margin:2px 0 14px;letter-spacing:.08em}
  .skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.skin{border:1px solid #34405d;border-radius:14px;background:#0d1330;padding:8px 6px 10px}.skin.eq{border-color:var(--cyan);box-shadow:0 0 18px #55f6ff22}
  .skin canvas{position:static;inset:auto;display:block;width:64px;height:64px;margin:0 auto}.sname{font-size:11px;font-weight:800;margin:2px 0 6px}.sbtn{width:100%;border:1px solid #394464;border-radius:9px;padding:7px 2px;background:#111831;color:#ffd166;font-size:11px;font-weight:800;cursor:pointer}.sbtn:disabled{color:var(--lime);border-color:var(--lime);opacity:.85}
  #loader{position:fixed;inset:0;z-index:9999;background:#050816;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s}
  #loader h1{margin:0}#loader p{margin:0;font-size:11px;letter-spacing:.3em;color:var(--muted)}
  .bar,.bar2{height:8px;border-radius:8px;background:#1a2040;overflow:hidden}.bar{width:60%;max-width:300px}
  .bar i,.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#9fffea);transition:width .3s}
  .profile{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px 12px;border:1px solid #34405d;border-radius:14px;background:#0d1330;text-align:left}
  .plv{font-size:22px;font-weight:950;color:var(--cyan);min-width:62px}.pbar{flex:1}.pbar .label{margin-bottom:5px}.bar2{height:6px}
  .modes{display:flex;gap:6px;margin-bottom:12px}.mode{flex:1;border:1px solid #394464;border-radius:10px;padding:9px 2px;background:#111831;font-size:11px;font-weight:800;cursor:pointer}
  .mode.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px #55f6ff22}.mode:disabled{opacity:.45;cursor:default}
  .new-record{height:auto;min-height:20px}.sbtn.lock:disabled{color:#9ba8c9;border-color:#394464}
  #startScreen .card{max-height:96vh;overflow-y:auto}
  #startScreen{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:16px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent 50%,rgba(5,7,20,.6) 100%),url(menu-bg.jpg) center top/cover #0a0e20}
  #startScreen>*{width:min(460px,100%);margin:0 auto}
  .profile{background:rgba(10,15,34,.82);backdrop-filter:blur(6px)}
  .avatar{position:relative;width:64px;height:64px;flex:none;border:2px solid var(--cyan);border-radius:16px;background:#0d1330;box-shadow:0 0 18px #55f6ff44}
  .avatar canvas{position:static;width:100%;height:100%}
  .lvbadge{position:absolute;right:-10px;bottom:-10px;padding:3px 7px;border-radius:10px;background:var(--pink);font-size:12px;font-weight:900;color:#fff;min-width:0}
  .pnext{font-size:9px;letter-spacing:.08em;color:#9ba8c9;margin-top:6px}.pstats{text-align:right}
  .modes{background:rgba(10,15,34,.7);padding:6px;border-radius:14px}
  .menu-row{display:flex;gap:10px}.menu-row .primary{flex:1;font-size:20px;padding:18px}
  .shopb{width:84px;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:8px}.shopb{font-size:20px}.shopb span{font-size:10px}
  .qrow{display:flex;gap:10px;align-items:center;margin:8px 0;padding:10px;border:1px solid #34405d;border-radius:12px;background:#0d1330;text-align:left}.qrow>div{flex:1}.qt{font-size:12px;margin-bottom:6px}.qrow .sbtn{width:auto;padding:8px 10px;flex:none}
  .qa{font-size:12px;color:#c6cee2;padding:3px 0;text-align:left}.qh{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--cyan);margin:14px 0 4px;text-align:left}.qrw{font-size:10px;color:#ffd166;margin-top:4px}
</style>
</head>
<body>
<div id="loader"><h1>NEON<br><span>DRIFT</span></h1><div class="bar"><i id="barFill"></i></div><p>LOADING</p></div>
<script>(function(){let p=0;const f=document.getElementById('barFill'),l=document.getElementById('loader');const t=setInterval(()=>{p+=Math.random()*18;f.style.width=Math.min(p,100)+'%';if(p>=100){clearInterval(t);setTimeout(()=>{l.style.opacity=0;setTimeout(()=>l.remove(),500)},200)}},120)})();</script>
<main id="game" aria-label="Neon Drift arcade game">
  <canvas id="stage" aria-label="Game play area"></canvas><div class="scanlines"></div><div class="vignette"></div>
  <header class="hud" aria-live="polite">
    <div><div class="brand">NEON / DRIFT</div><div class="hud-values">
      <div class="stat"><div class="label">Score</div><div class="value score" id="score">0000</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value lives" id="lives">♥ ♥ ♥</div></div>
      <div class="stat"><div class="label">Level</div><div class="value time" id="timer">1</div></div>
      <div class="stat"><div class="label">Coins</div><div class="value coin" id="coins">0</div></div>
    </div></div>
    <div class="hud-actions"><button class="icon-btn" id="pauseBtn" aria-label="Pause game" title="Pause (P)">Ⅱ</button><button class="icon-btn" id="soundBtn" aria-label="Toggle sound" title="Toggle sound">♫</button></div>
  </header>
  <div class="toast" id="toast" role="status"></div>
  <section class="screen" id="startScreen" aria-label="Main menu">
    <div class="profile"><div class="avatar"><canvas id="avatar" width="96" height="96"></canvas><div class="lvbadge" id="plv">LV 1</div></div>
      <div class="pbar"><div class="label" id="pxp">0 / 100 XP</div><div class="bar2"><i id="pxpFill"></i></div><div class="pnext" id="pnext"></div></div>
      <div class="pstats"><div class="label">Best</div><strong id="startBest" style="color:var(--lime)">0000</strong><div class="label" style="margin-top:4px">Coins</div><strong id="startCoins" style="color:#ffd166">0</strong></div></div>
    <div class="modes" id="modes"></div>
    <div class="menu-row"><button class="secondary shopb" id="shopBtn">🛒<span>Shop</span></button><button class="secondary shopb" id="questBtn">🎯<span>Daily</span></button><button class="primary" id="playBtn">Play</button></div>
  </section>
  <section class="screen hidden" id="questScreen" aria-label="Challenges"><div class="card shop"><div class="eyebrow">Challenges</div><h2 class="gameover-title">DAILY</h2><div id="qList"></div><button class="secondary" id="qBack">Back</button></div></section>
  <section class="screen hidden" id="overScreen" aria-labelledby="overTitle">
    <div class="card"><div class="eyebrow">Signal lost</div><h2 class="gameover-title" id="overTitle">RUN COMPLETE</h2><div class="final-score" id="finalScore">0</div><div class="final-caption">Final score</div><div class="new-record" id="recordMsg"></div><div class="final-caption" id="runInfo"></div><button class="primary" id="restartBtn" style="margin-top:16px">Run it back</button><button class="secondary" id="menuBtn">Main menu</button><button class="secondary" id="shopBtn2">Hangar · ship skins</button></div>
  </section>
  <section class="screen hidden" id="shopScreen" aria-labelledby="shopTitle">
    <div class="card shop"><div class="eyebrow">Hangar</div><h2 class="gameover-title" id="shopTitle">SHIP SKINS</h2><div class="wallet">◈ <span id="shopCoins">0</span> COINS</div><div class="skins" id="skinList"></div><button class="primary" id="shopBack">Back</button></div>
  </section>
  <section class="screen hidden" id="pauseScreen" aria-labelledby="pauseTitle">
    <div class="card"><div class="eyebrow">Take a breath</div><h2 class="gameover-title" id="pauseTitle">PAUSED</h2><p class="subtitle">Your run is waiting.</p><div class="menu-row"><button class="secondary" id="pMenuBtn">Main menu</button><button class="primary" id="resumeBtn">Resume</button></div></div>
  </section>
  <div class="touch-controls" aria-label="Touch movement controls"><button class="touch-btn" id="leftBtn" aria-label="Move left">‹</button><button class="touch-btn" id="rightBtn" aria-label="Move right">›</button></div>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const ui = Object.fromEntries(['score','lives','timer','coins','startBest','startCoins','runInfo','shopScreen','shopBtn','shopBtn2','shopBack','shopCoins','skinList','finalScore','recordMsg','startScreen','overScreen','pauseScreen','playBtn','restartBtn','pauseBtn','resumeBtn','soundBtn','leftBtn','rightBtn','toast'].map(id => [id, document.getElementById(id)]));
  const COLORS = {cyan:'#55f6ff',pink:'#ff4dc4',lime:'#c4ff54',violet:'#9575ff'};
  const SHAPES=[[[0,-21],[16,11],[0,6],[-16,11]],[[0,-22],[20,12],[8,8],[0,14],[-8,8],[-20,12]],[[0,-21],[7,-4],[19,6],[19,13],[7,8],[0,12],[-7,8],[-19,13],[-19,6],[-7,-4]]];
  const SKINS=[
    {id:'classic',name:'Classic',price:0,body:'#55f6ff',glow:'#55f6ff',flame:'#ff4dc4',shape:0},
    {id:'pulse',name:'Pulse',price:40,body:'#ff4dc4',glow:'#ff4dc4',flame:'#55f6ff',shape:0},
    {id:'phantom',name:'Phantom',price:100,body:'#9575ff',glow:'#9575ff',flame:'#c4ff54',shape:1},
    {id:'solar',name:'Solar',price:200,body:'#ffd166',glow:'#ff9f1c',flame:'#ff4d4d',shape:2},
    {id:'venom',name:'Venom',price:400,body:'#c4ff54',glow:'#c4ff54',flame:'#9575ff',shape:1},
    {id:'ghost',name:'Ghost',price:700,body:'#ffffff',glow:'#9fefff',flame:'#55f6ff',shape:2}
  ];
  SKINS.push({id:'comet',name:'Comet',price:0,lv:5,body:'#ff9f1c',glow:'#ffd166',flame:'#ff4dc4',shape:1},{id:'aurora',name:'Aurora',price:0,lv:10,body:'#7dffb2',glow:'#55f6ff',flame:'#9575ff',shape:2},{id:'nova',name:'Nova',price:1000,body:'#ff4d6d',glow:'#ff4dc4',flame:'#ffd166',shape:2},{id:'royal',name:'Royal',price:0,chest:true,body:'#ffd166',glow:'#fff1a8',flame:'#ff4dc4',shape:2});
  const MODES={classic:{n:'Classic',lv:1,lives:3,spd:1,mul:1},chill:{n:'Chill',lv:2,lives:5,spd:.8,mul:.6},hard:{n:'Hardcore',lv:4,lives:1,spd:1.25,mul:2}};
  const $=id=>document.getElementById(id), mode=()=>dailyRun?MODES.classic:(MODES[save.mode]||MODES.classic), xpNeed=l=>100+(l-1)*60;
  let maxLives=3,dailyRun=false,dr=Math.random;const R=()=>dailyRun?dr():Math.random();
  let W=0,H=0,DPR=1, state='start', score=0, lives=3, timeLeft=60, elapsed=0;
  let level=1, runCoins=0, save=loadSave(), shopFrom='start', best=readBest(), player, objects=[], particles=[], stars=[], spawnClock=0, lastFrame=0, hudClock=0, shake=0, muted=false, audioCtx=null, newRecord=false;
  const input={left:false,right:false};
  function readBest(){try{return Number(localStorage.getItem('neon-drift-best'))||0}catch{return 0}}
  function saveBest(){try{localStorage.setItem('neon-drift-best',String(best))}catch{}}
  function loadSave(){let s={};try{s=JSON.parse(localStorage.getItem('neon-drift-save')||'{}')}catch{}const o=Array.isArray(s.owned)?s.owned:[];if(!o.includes('classic'))o.push('classic');return{...s,coins:s.coins|0,owned:o,skin:s.skin||'classic',xp:s.xp|0,mode:MODES[s.mode]?s.mode:'classic'}}
  function writeSave(){try{localStorage.setItem('neon-drift-save',JSON.stringify(save))}catch{}}
  function plevel(){let l=1,x=save.xp;while(x>=xpNeed(l)){x-=xpNeed(l);l++}return{l,x,n:xpNeed(l)}}
  function renderProfile(){const p=plevel();$('plv').textContent='LV '+p.l;$('pxp').textContent=p.x+' / '+p.n+' XP';$('pxpFill').style.width=(p.x/p.n*100)+'%';const r=[...SKINS.filter(s=>s.lv).map(s=>[s.lv,s.name+' skin']),...Object.values(MODES).filter(m=>m.lv>1).map(m=>[m.lv,m.n+' mode'])].filter(x=>x[0]>p.l).sort((a,b)=>a[0]-b[0])[0];$('pnext').textContent=r?'NEXT REWARD · LV '+r[0]+' · '+r[1]:'EVERY NEW LEVEL · +25 COINS'}
  function drawAvatar(){const c=$('avatar').getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,96,96);c.translate(48,52);c.scale(1.5,1.5);drawShip(c,skinOf(save.skin),0,false)}
  function renderModes(){const m=$('modes'),pl=plevel().l;m.innerHTML='';for(const k in MODES){const d=MODES[k],b=document.createElement('button');b.className='mode'+(save.mode===k?' on':'');b.dataset.k=k;b.disabled=pl<d.lv;b.textContent=pl<d.lv?d.n+' 🔒LV'+d.lv:d.n;m.appendChild(b)}}
  function grantSkins(){const l=plevel().l;let n=0;SKINS.forEach(s=>{if(s.lv&&l>=s.lv&&!save.owned.includes(s.id)){save.owned.push(s.id);n++}});if(n)writeSave();return n}
  function drawShield(o){const col={shield:COLORS.violet,magnet:COLORS.lime,slow:COLORS.cyan}[o.kind];ctx.save();ctx.translate(o.x,o.y);ctx.shadowBlur=18;ctx.shadowColor=col;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,o.r*.95,0,6.28);ctx.stroke();ctx.fillStyle=col+'44';ctx.fill();ctx.shadowBlur=0;ctx.font='15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({shield:'🛡',magnet:'🧲',slow:'⏳'}[o.kind],0,1);ctx.restore()}
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()},week=()=>Math.floor((Date.now()/864e5+3)/7);
  const seedOf=t=>{let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
  const rng=a=>()=>{a=Math.imul(a^a>>>15,a|1);a^=a+Math.imul(a^a>>>7,a|61);return((a^a>>>14)>>>0)/4294967296};

    spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=Math.max(.15,.72-elapsed*.006)+Math.random()*.2}
    for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=o.speed*dt*sl;o.x+=o.drift*dt*sl;o.rot+=o.spin*dt;if(o.seek)o.x+=Math.sign(player.x-o.x)*70*dt;if(o.boss)o.x=W/2+Math.sin(elapsed*1.8)*(W/2-o.r-16);if(player.mag>0&&(o.kind==='coin'||o.kind==='orb')&&Math.hypot(o.x-player.x,o.y-player.y)<230){o.x+=(player.x-o.x)*4*dt;o.y+=(player.y-o.y)*4*dt}o.x=clamp(o.x,o.r,W-o.r);
      const dx=o.x-player.x,dy=o.y-player.y,rr=o.r+player.r*.76;
      if(dx*dx+dy*dy<rr*rr){objects.splice(i,1);if(o.kind==='coin'){getCoin(o)}else if(o.kind==='shield'||o.kind==='magnet'||o.kind==='slow'){powerUp(o)}else if(o.kind==='orb'){comboUp();addScore(o.value);burst(o.x,o.y,o.value===25?COLORS.lime:COLORS.cyan,14);beep(o.value===25?970:760,.11,'sine',.045)}else{hit();if(state!=='playing')return}continue}
      if(o.y>H+o.r+5){if(o.boss){addScore(200);save.coins+=10;runCoins+=10;save.bn=(save.bn|0)+1;bump('boss',1);showToast('BOSS DODGED +200')}objects.splice(i,1)}
    }
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.15,dt);p.vy*=Math.pow(.15,dt);p.life-=dt;if(p.life<=0)particles.splice(i,1)}
    shake=Math.max(0,shake-32*dt);hudClock+=dt;if(hudClock>.1){hudClock=0;updateHUD()}
  }
  function drawBackground(t){
    ctx.clearRect(0,0,W,H);const grad=ctx.createRadialGradient(W*.5,H*.72,10,W*.5,H*.72,Math.max(W,H)*.85);grad.addColorStop(0,'#151632');grad.addColorStop(.55,'#0b1022');grad.addColorStop(1,'#070914');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    const horizon=H*.4;ctx.save();ctx.strokeStyle='rgba(85,246,255,.075)';ctx.lineWidth=1;
    for(let i=0;i<14;i++){const y=horizon+((i*i*2+t*30)%(H-horizon));ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(W/2+i*13,horizon);ctx.lineTo(W/2+i*W*.105,H);ctx.stroke()}ctx.restore();
    for(const s of stars){s.y+=s.s*(state==='playing'?1.6:.35)*Math.max(.016,Math.min(.04,1/60));if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.globalAlpha=s.a*(.6+.4*Math.sin(t*.001+s.phase));ctx.fillStyle=COLORS.cyan;ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
  }
  function drawPlayer(t){if(!player)return;const s=skinOf(save.skin);ctx.save();for(const p of player.trail){if(p.life<=0)continue;ctx.globalAlpha=p.life/.23*.25;ctx.fillStyle=s.glow;ctx.beginPath();ctx.arc(p.x,p.y,player.r*p.life/.23,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const blink=state==='playing'&&Math.floor(t/90)%2===0&&lives<maxLives;ctx.translate(player.x,player.y);drawShip(ctx,s,t,blink);if(player.shield){ctx.strokeStyle=COLORS.violet;ctx.lineWidth=2.5;ctx.shadowBlur=16;ctx.shadowColor=COLORS.violet;ctx.beginPath();ctx.arc(0,0,player.r+9,0,6.28);ctx.stroke()}ctx.restore()}
  function drawObjects(t){for(const o of objects){if(o.kind==='coin'){drawCoin(o,t);continue}if(o.kind==='shield'||o.kind==='magnet'||o.kind==='slow'){drawShield(o);continue}ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.shadowBlur=18;ctx.shadowColor=o.kind==='orb'?(o.value===25?COLORS.lime:COLORS.cyan):COLORS.pink;
      if(o.kind==='orb'){ctx.strokeStyle=o.value===25?COLORS.lime:COLORS.cyan;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,0,o.r*.78,0,Math.PI*2);ctx.stroke();ctx.fillStyle=o.value===25?COLORS.lime:COLORS.cyan;ctx.beginPath();ctx.moveTo(0,-o.r*.55);ctx.lineTo(o.r*.42,0);ctx.lineTo(0,o.r*.55);ctx.lineTo(-o.r*.42,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-3,2,0,Math.PI*2);ctx.fill()}
      else{ctx.fillStyle=o.seek?COLORS.violet:COLORS.pink;ctx.beginPath();for(let k=0;k<8;k++){const rr=k%2?o.r*.58:o.r;const a=k*Math.PI/4;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.fillStyle='#30112e';ctx.beginPath();ctx.arc(0,0,o.r*.37,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd5f2';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-o.r*.25,0);ctx.lineTo(o.r*.25,0);ctx.stroke()}
      ctx.restore()}}
  function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
  function frame(now){if(!lastFrame)lastFrame=now;const dt=Math.min(.033,Math.max(0,(now-lastFrame)/1000));lastFrame=now;drawBackground(now);if(state==='playing')update(dt);if(shake>0)ctx.save(),ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawObjects(now);drawParticles();drawPlayer(now);if(shake>0)ctx.restore();requestAnimationFrame(frame)}
  function bindHold(button,which){button.addEventListener('pointerdown',e=>{e.preventDefault();input[which]=true;button.classList.add('pressed');button.setPointerCapture?.(e.pointerId)});const release=e=>{e.preventDefault?.();input[which]=false;button.classList.remove('pressed')};button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release)}
  bindHold(ui.leftBtn,'left');bindHold(ui.rightBtn,'right');
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')input.left=true;if(k==='arrowright'||k==='d')input.right=true;if((k==='p'||k==='escape')&&state==='playing'||(k==='p'||k==='escape')&&state==='paused')pause();if(k===' '&&state==='start')freshRun();if(k===' '&&state==='over')freshRun()});
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')input.left=false;if(k==='arrowright'||k==='d')input.right=false});window.addEventListener('blur',()=>{input.left=input.right=false;if(state==='playing')pause()});
  ui.playBtn.addEventListener('click',()=>{dailyRun=false;freshRun()});ui.shopBtn.addEventListener('click',()=>openShop('start'));ui.shopBtn2.addEventListener('click',()=>openShop('over'));ui.shopBack.addEventListener('click',()=>setState(shopFrom));
  ui.skinList.addEventListener('click',e=>{const b=e.target.closest('.sbtn');if(!b||b.disabled)return;const s=skinOf(b.dataset.id);if(!save.owned.includes(s.id)&&(s.lv||s.chest))return;if(!save.owned.includes(s.id)){if(save.coins<s.price){showToast('Need '+(s.price-save.coins)+' more coins');return}save.coins-=s.price;save.owned.push(s.id);beep(1200,.12,'triangle',.05)}save.skin=s.id;writeSave();renderShop();setBestUI();showToast(s.name+' equipped')});ui.restartBtn.addEventListener('click',freshRun);ui.pauseBtn.addEventListener('click',()=>{if(state==='playing'||state==='paused')pause()});ui.resumeBtn.addEventListener('click',pause);
  ui.soundBtn.addEventListener('click',()=>{muted=!muted;ui.soundBtn.textContent=muted?'♫̸':'♫';ui.soundBtn.setAttribute('aria-label',muted?'Enable sound':'Mute sound');if(!muted){requestAudio();beep(620,.06)}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});window.addEventListener('resize',resize,{passive:true});$('modes').addEventListener('click',e=>{const b=e.target.closest('.mode');if(!b||b.disabled)return;save.mode=b.dataset.k;writeSave();renderModes()});prog();grantSkins();dailyLogin();$('questBtn').addEventListener('click',()=>setState('quest'));$('qBack').addEventListener('click',()=>{setState('start');setBestUI()});$('pMenuBtn').addEventListener('click',()=>setState('start'));$('qList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const k=b.dataset.k;prog();if(k==='dc'){dailyRun=true;freshRun();return}const d=dailyQ().find(q=>q.id===k),w=weeklyQ().find(q=>q.id===k);if(d){save.qd.c.push(k);save.coins+=d.rw;showToast('+'+d.rw+' COINS')}else if(w){save.qw.c.push(k);save.coins+=w.rw;showToast('+'+w.rw+' COINS · '+chest())}writeSave();renderQuests()});
setBestUI();renderModes();drawAvatar();$('menuBtn').addEventListener('click',()=>setState('start'));resize();requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
